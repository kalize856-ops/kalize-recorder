
name: Extract Android Source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check source ZIP exists
        run: |
          test -f kalize_recorder_source_download.zip

      - name: Extract Android project
        run: |
          mkdir -p /tmp/kalize-source
          unzip -o kalize_recorder_source_download.zip -d /tmp/kalize-source
          test -f /tmp/kalize-source/android/app/src/main/AndroidManifest.xml
          mkdir -p android
          cp -R /tmp/kalize-source/android/. android/

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Extract editable Android source"
            git push
          fi
