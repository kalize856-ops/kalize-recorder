
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify editable Android source
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/kalize/recorder/MainActivity.kt
          test -f android/app/src/main/java/com/kalize/recorder/ScreenRecordingService.kt
          find android/app/src/main -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java and Kotlin targets
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          old = "    buildFeatures { compose = true }"
          new = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures { compose = true }"""

          if old in s and 'jvmTarget = "17"' not in s:
              if old not in s:
                  raise SystemExit("Could not find the expected buildFeatures line.")
              p.write_text(s.replace(old, new, 1))
          PY

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalize-recorder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
