name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KALIZE_KEYSTORE_BASE64: ${{ secrets.KALIZE_KEYSTORE_BASE64 }}
      KALIZE_KEYSTORE_PASSWORD: ${{ secrets.KALIZE_KEYSTORE_PASSWORD }}
      KALIZE_KEY_ALIAS: ${{ secrets.KALIZE_KEY_ALIAS }}
      KALIZE_KEY_PASSWORD: ${{ secrets.KALIZE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare release signing key
        if: github.event_name != 'pull_request' && env.KALIZE_KEYSTORE_BASE64 != '' && env.KALIZE_KEYSTORE_PASSWORD != '' && env.KALIZE_KEY_ALIAS != '' && env.KALIZE_KEY_PASSWORD != ''
        run: |
          echo "$KALIZE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kalize-release.jks"
          echo "KALIZE_KEYSTORE_PATH=$RUNNER_TEMP/kalize-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and Android App Bundle
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kalize-Recorder-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload signed release packages
        uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request' && env.KALIZE_KEYSTORE_BASE64 != '' && env.KALIZE_KEYSTORE_PASSWORD != '' && env.KALIZE_KEY_ALIAS != '' && env.KALIZE_KEY_PASSWORD != ''
        with:
          name: Kalize-Recorder-release-signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload unsigned release candidates
        uses: actions/upload-artifact@v4
        if: success() && (github.event_name == 'pull_request' || env.KALIZE_KEYSTORE_BASE64 == '' || env.KALIZE_KEYSTORE_PASSWORD == '' || env.KALIZE_KEY_ALIAS == '' || env.KALIZE_KEY_PASSWORD == '')
        with:
          name: Kalize-Recorder-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 14
